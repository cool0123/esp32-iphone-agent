name: IPhoneAgent
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  IPhoneAgentLegacy:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Legacy
      - IPhoneAgent/Agent
      - IPhoneAgent/Board
      - IPhoneAgent/Video
      - IPhoneAgent/App/IslandStatus.swift
      - IPhoneAgent/Services/Settings.swift
      - IPhoneAgent/Services/LLMClient.swift
      - IPhoneAgent/Services/ModelProvider.swift
      - IPhoneAgent/Services/ModelRequestFailure.swift
      - IPhoneAgent/Services/ModelResponseProgress.swift
      - IPhoneAgent/Services/ModelConnectionCheck.swift
      - IPhoneAgent/Services/Metrics.swift
      - IPhoneAgent/Services/DebugLog.swift
      - IPhoneAgent/Services/TraceStore.swift
      - IPhoneAgent/Services/OpsController.swift
      - IPhoneAgent/Services/Redactor.swift
      - path: ../prompts
        type: folder
        buildPhase: resources
    info:
      path: Legacy/Info.plist
      properties:
        CFBundleDisplayName: ESP32 Agent 15
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "15"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 接收开发板的视频并连接局域网运维服务。
        NSBluetoothAlwaysUsageDescription: 连接开发板以接收屏幕画面并操作手机。
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.esp32agent.legacy
        PRODUCT_NAME: IPhoneAgentLegacy
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) LEGACY_IOS
  IPhoneAgent:
    type: application
    platform: iOS
    sources:
      - IPhoneAgent
      - Shared
      - path: ../prompts  # the model prompts, bundled as a folder
        type: folder
        buildPhase: resources
    dependencies:
      - target: AgentActivity
        embed: true
    info:
      path: IPhoneAgent/Info.plist
      properties:
        CFBundleDisplayName: ESP32 Agent
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false  # HTTPS only
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(IA_BUNDLE_ID)
            CFBundleURLSchemes: [iphoneagent]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Receive screen video from the local board.
        NSBluetoothAlwaysUsageDescription: ESP32 Agent talks to its USB board over Bluetooth to see the screen and move the pointer.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:  # shared run archives (Settings › Privacy › Export) open as imported runs
          - CFBundleTypeName: ESP32 Agent runs
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
        # Optional build-time LLM preset from Config/Local.xcconfig (empty in the open-source build)
        IAPresetBaseURL: $(IA_PRESET_BASE_URL)
        IAPresetModel: $(IA_PRESET_MODEL)
        IAPresetKey: $(IA_PRESET_KEY)
        IAAppGroup: group.$(IA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID)
        PRODUCT_NAME: IPhoneAgent
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Hotspot entitlement needs an Apple ID in Xcode; opt in via Local.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(IA_ENTITLEMENTS)
  AgentActivity:
    type: app-extension
    platform: iOS
    sources: [AgentActivity, Shared]
    info:
      path: AgentActivity/Info.plist
      properties:
        CFBundleDisplayName: ESP32 Agent
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        IAAppGroup: group.$(IA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).activity
        CODE_SIGN_ENTITLEMENTS: $(IA_WIDGET_ENTITLEMENTS)
        PRODUCT_NAME: AgentActivity
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
  IPhoneAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IPhoneAgentTests]
    dependencies:
      - target: IPhoneAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IA_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/IPhoneAgent.app/IPhoneAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  IPhoneAgentLegacy:
    build:
      targets:
        IPhoneAgentLegacy: all
  IPhoneAgent:
    build:
      targets:
        IPhoneAgent: all
        IPhoneAgentTests: [test]
    test:
      targets: [IPhoneAgentTests]
